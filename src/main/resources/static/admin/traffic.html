<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Traffic Data</title>

<link rel="stylesheet" href="/shared/layout.css">
<script src="/shared/api.js"></script>

<style>
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.table {
  width: 100%;
  border-collapse: collapse;
}

.table th, .table td {
  padding: 10px;
  text-align: left;
  border-bottom: 1px solid #334155;
}

.table th {
  color: #94a3b8;
}

.btn {
  padding: 5px 10px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

.btn-edit {
  background: #3b82f6;
  color: white;
}

.btn-delete {
  background: #ef4444;
  color: white;
}
</style>
</head>

<body>

<div class="layout">
  <div id="sidebar"></div>

  <main class="main">

    <!-- ✅ TOPBAR -->
    <div class="topbar">
      <h2>🚗 Traffic Data</h2>
      <button class="btn btn-delete" onclick="logout()">Logout</button>
    </div>

    <!-- ADD FORM -->
    <div class="card">
      <h3>Add Traffic</h3>
      <input id="loc" placeholder="Location">
      <input id="count" placeholder="Vehicle Count">
      <button class="btn btn-edit" onclick="add()">Add</button>
    </div>

    <!-- TABLE -->
    <table class="table">
      <thead>
        <tr>
          <th>Location</th>
          <th>Vehicles</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="data"></tbody>
    </table>

  </main>
</div>

<script>

requireAuth("ADMIN");

fetch('/shared/sidebar.html')
.then(res => res.text())
.then(html => {
  document.getElementById("sidebar").innerHTML = html;
});

async function load(){
  const res = await Traffic.getAll();
  const data = res?.data || [];

  document.getElementById("data").innerHTML =
    data.map(x=>`
      <tr>
        <td>${x.location}</td>
        <td>${x.vehicleCount}</td>
        <td>${x.congestionLevel}</td>
        <td>
        <button class="btn btn-edit"
        	onclick="edit(${x.id}, '${x.location}', ${x.vehicleCount})">
        	Edit
        	</button>
        <button class="btn btn-delete" onclick="del(${x.id})">Delete</button>
      </td>
      </tr>
    `).join('');
}

async function add(){
	  const loc = document.getElementById("loc").value;
	  const count = document.getElementById("count").value;

	  await Traffic.create({
	    location: loc,
	    vehicleCount: parseInt(count)
	  });

	  load();
	}

async function del(id){
  await Traffic.delete(id);
  load();
}

load();

async function edit(id, oldLocation, oldCount){

	  const location = prompt("Enter location:", oldLocation);
	  if (location === null) return; // cancel safe

	  const countInput = prompt("Enter vehicle count:", oldCount);
	  if (countInput === null) return;

	  const count = parseInt(countInput);

	  if (isNaN(count)) {
	    alert("Vehicle count must be a number");
	    return;
	  }

	  await Traffic.update(id, {
	    location: location,
	    vehicleCount: count
	  });

	  load();
	}
</script>

</body>
</html>
