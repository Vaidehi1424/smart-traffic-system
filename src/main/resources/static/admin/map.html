<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Live Map</title>

<link rel="stylesheet" href="/shared/layout.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/shared/api.js"></script>

<style>
#map {
  height: 500px;
  border-radius: 10px;
  margin-top: 15px;
}

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.search-box input {
  padding: 8px;
  width: 250px;
  border-radius: 6px;
  border: none;
}

.btn {
  padding: 8px 14px;
  background: #3b82f6;
  border: none;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <div id="sidebar"></div>

  <!-- MAIN -->
  <main class="main">

    <h2>🗺 Live Traffic Map</h2>

    <!-- SEARCH -->
    <div class="search-box">
      <input id="search" placeholder="Search location (e.g. Hitech City)">
      <button class="btn" onclick="searchLocation()">Search</button>
    </div>

    <div id="map"></div>

  </main>
</div>

<script>

// 🔐 protect admin page
requireAuth("ADMIN");

// 📌 load admin sidebar
fetch('/shared/sidebar.html')
.then(res => res.text())
.then(html => {
  document.getElementById("sidebar").innerHTML = html;
});

// 🌍 initialize map
const map = L.map('map').setView([17.3850, 78.4867], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// 🔍 search location
async function searchLocation() {
  const q = document.getElementById("search").value;
  if (!q) return;

  const res = await fetch(`/api/geocode?q=${q}`);
  if (!res.ok) {
    alert("Search failed");
    return;
  }

  const data = await res.json();

  if (!data.data || data.data.length === 0) {
    alert("Location not found");
    return;
  }

  const loc = data.data[0];
  const lat = parseFloat(loc.lat);
  const lon = parseFloat(loc.lon);

  map.setView([lat, lon], 14);

  L.marker([lat, lon])
    .addTo(map)
    .bindPopup(`📍 ${q}`)
    .openPopup();
}

// 🚗 load traffic markers
async function loadTraffic() {
  const res = await Traffic.getAll();
  const data = res?.data || [];

  data.forEach(t => {
    if (!t.latitude || !t.longitude) return;

    const color = t.congestionLevel === "HIGH" ? "red" : "green";

    L.circleMarker([t.latitude, t.longitude], {
      radius: 8,
      color: color
    }).addTo(map)
    .bindPopup(`
      🚗 ${t.location}<br>
      Vehicles: ${t.vehicleCount}<br>
      Status: ${t.congestionLevel}
    `);
  });
}

// 🚀 load traffic when page loads
window.onload = loadTraffic;

</script>

</body>
</html>
