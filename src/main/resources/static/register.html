<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register - TrafficAI</title>

<script src="/shared/api.js"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial;
  background: linear-gradient(135deg, #020617, #0f172a);
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.card {
  width: 350px;
  padding: 30px;
  border-radius: 16px;
  background: rgba(30,41,59,0.9);
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  text-align: center;
}

h2 {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
  border: none;
  background: #0f172a;
  color: white;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}

a {
  color: #38bdf8;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="card">

  <h2>🚦 Create Account</h2>

  <input id="username" placeholder="Username">
<input id="email" placeholder="Email">   <!-- ✅ ADD THIS -->
<input id="password" type="password" placeholder="Password">

  <button onclick="register()">Register</button>

  <p style="margin-top:10px;">
    Already have account?
    <a href="/login.html">Login</a>
  </p>

</div>

<script>
async function register() {

  const username = document.getElementById("username").value;
  const email = document.getElementById("email").value;   // ✅ ADD
  const password = document.getElementById("password").value;

  const res = await request("/auth/register", "POST", {
    username,
    email,     // ✅ REQUIRED
    password
  });

  console.log("REGISTER RESPONSE:", res);

  if (res && res.status === 200) {
    alert("Registered!");
    window.location.href = "/login.html";
  } else {
    alert(res?.message || "Error");
  }
}
</script>

</body>
</html>
