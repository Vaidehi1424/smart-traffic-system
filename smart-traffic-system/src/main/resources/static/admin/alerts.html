<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Alerts</title>

<link rel="stylesheet" href="/shared/layout.css">
<script src="/shared/api.js"></script>

<style>
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.input-group {
  display: flex;
  gap: 10px;
}

.input-group input {
  flex: 1;
  padding: 10px;
  border-radius: 6px;
  border: none;
}

.btn {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

.btn-add { background: #3b82f6; color: white; }
.btn-delete { background: #ef4444; color: white; }
.btn-resolve { background: #22c55e; color: white; }

/* ALERT CARD */
.alert-card {
  background: #0f172a;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.alert-left {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.location {
  font-weight: bold;
  color: #38bdf8;
}

.desc {
  color: #e2e8f0;
}

.status {
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 6px;
  width: fit-content;
}

.active { background: #ef4444; color: white; }
.resolved { background: #22c55e; color: white; }

.actions {
  display: flex;
  gap: 8px;
}
</style>
</head>

<body>

<div class="layout">
  <div id="sidebar"></div>

  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <h2>🚨 Alerts</h2>
      <button class="btn btn-delete" onclick="logout()">Logout</button>
    </div>

    <!-- ADD ALERT -->
    <div class="card">
      <div class="input-group">
       <input id="loc" placeholder="Location">
<input id="alertType" placeholder="Alert Type">

<button onclick="addAlert()">Add Alert</button>
      </div>
    </div>

    <!-- ALERT LIST -->
    <div id="list"></div>

  </main>
</div>

<script>

requireAuth("ADMIN");

fetch('/shared/sidebar.html')
.then(res => res.text())
.then(html => {
  document.getElementById("sidebar").innerHTML = html;
});


// LOAD ALERTS
async function load(){
  const res = await Alerts.getAll();
  const data = res?.data || [];

  document.getElementById("list").innerHTML =
    data.map(a => `
      <div class="alert-card">

        <div class="alert-left">
          <div class="location">📍 ${a.location || 'Unknown'}</div>
          <div class="desc">${a.alertType}</div>
          <div class="status ${a.status === 'RESOLVED' ? 'resolved' : 'active'}">
            ${a.status}
          </div>
        </div>

        <div class="actions">
          ${a.status !== 'RESOLVED' ? 
            `<button class="btn btn-resolve" onclick="resolve(${a.id})">Resolve</button>` 
            : ''
          }
          <button class="btn btn-delete" onclick="del(${a.id})">Delete</button>
        </div>

      </div>
    `).join('');
}


// ADD ALERT
async function addAlert() {
  const location = document.getElementById("loc").value;
  const alertType = document.getElementById("alertType").value;

  const payload = {
    location: location,
    alertType: alertType,
    status: "ACTIVE"
  };

  console.log("SENDING:", payload);

  await Alerts.create(payload);

  load();

  // clear inputs
  document.getElementById("loc").value = "";
  document.getElementById("alertType").value = "";
}


// RESOLVE ALERT
async function resolve(id){
  await Alerts.resolve(id);
  load();
}


// DELETE ALERT
async function del(id){
  if (!confirm("Delete alert?")) return;

  await Alerts.delete(id);
  load();
}

load();
</script>

</body>
</html>
